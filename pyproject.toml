[project]
name = "sku-barcode-printer"
version = "0.1.0"
description = "从订单表格截图识别 SKU 与数量，渲染 Code128 标签并打印到 CTPrinter CT-428D"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flask>=3.1.3",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.27.0",
    "pillow>=12.3.0",
    "python-barcode>=0.16.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "numpy>=2.5.1",
    "pypdfium2>=4.30.0",
]

[tool.uv]
package = false
